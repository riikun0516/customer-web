name: Release

# バージョンタグ（例: v1.1.0）をpushすると、そのタグでGitHub Releaseを自動作成する。
# COBIS Web版の「システム更新」機能（管理画面）は、この公開されたReleaseを見て
# 最新バージョンを検出するため、タグを打つだけで配布が完了する。

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
